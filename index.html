<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Học Tập Lớp 12</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: all 0.3s ease; }
        body { background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        
        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative; }
        h2 { border-bottom: 2px solid #3498db; padding-bottom: 8px; color: #3498db; margin-top: 0; font-size: 1.2rem; }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input, select { padding: 10px; border: 1px solid #dfe6e9; border-radius: 6px; flex: 1; outline: none; }
        input:focus, select:focus { border-color: #3498db; }
        button { background-color: #2ecc71; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #27ae60; transform: translateY(-2px); }
        
        ul { list-style: none; padding: 0; margin: 0; min-height: 50px; }
        li { background: #fdfdfd; border: 1px solid #f1f2f6; border-left: 4px solid #3498db; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-radius: 6px; }
        li:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        .item-content { display: flex; align-items: center; gap: 12px; flex: 1; cursor: pointer; }
        .completed .item-text { text-decoration: line-through; color: #a4b0be; }
        .completed { border-left-color: #2ecc71; background: #f9fdfa; }
        
        .actions { display: flex; gap: 8px; }
        .btn-icon { background: none; border: none; padding: 5px; border-radius: 4px; cursor: pointer; color: #a4b0be; }
        .btn-icon:hover { background: #f1f2f6; color: #e74c3c; transform: translateY(0); }
        
        .tag { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .tag-Toán { background: #fee2e2; color: #991b1b; }
        .tag-Văn { background: #ffedd5; color: #c2410c; }
        .tag-Anh { background: #e0f2fe; color: #0369a1; }
        .tag-Lý { background: #dcfce7; color: #166534; }
        .tag-Hóa { background: #f3e8ff; color: #6b21a8; }
        .tag-Sinh { background: #fae8ff; color: #86198f; }
        .tag-default { background: #f1f5f9; color: #475569; }

        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 6px; padding: 12px 20px; position: fixed; right: 20px; bottom: 30px; font-size: 14px; transform: translateY(20px); opacity: 0; z-index: 999; }
        #toast.show { visibility: visible; transform: translateY(0); opacity: 1; }
        
        .loading { text-align: center; color: #7f8c8d; font-size: 14px; padding: 20px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fa-solid fa-graduation-cap"></i> Kế Hoạch & Thời Khóa Biểu Lớp 12</h1>

    <div class="grid">
        <!-- CỘT 1 -->
        <div class="card">
            <h2><i class="fa-solid fa-bullseye"></i> Mục Tiêu Môn Học</h2>
            <div class="input-group">
                <select id="monHoc">
                    <option value="Toán">Toán</option>
                    <option value="Văn">Ngữ Văn</option>
                    <option value="Anh">Tiếng Anh</option>
                    <option value="Lý">Vật Lý</option>
                    <option value="Hóa">Hóa Học</option>
                    <option value="Sinh">Sinh Học</option>
                    <option value="Khác">Khác</option>
                </select>
                <input type="text" id="noiDungMon" placeholder="Mục tiêu (vd: Luyện 10 đề)...">
                <button onclick="themKeHoachMon()"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div id="loadingMon" class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu...</div>
            <ul id="dsKeHoachMon"></ul>
        </div>

        <!-- CỘT 2 -->
        <div class="card">
            <h2><i class="fa-solid fa-clock"></i> Thời Khóa Biểu Hôm Nay</h2>
            <div class="input-group">
                <input type="time" id="gioHoc">
                <input type="text" id="congViec" placeholder="Nhiệm vụ (vd: Học Lý thuyết)...">
                <button onclick="themTKB()"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div id="loadingTKB" class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu...</div>
            <ul id="dsTKB"></ul>
        </div>
    </div>
</div>

<div id="toast"><i class="fa-solid fa-circle-info"></i> <span id="toast-msg">Thông báo</span></div>

<script>
    // ---------------------------------------------------------
    // BƯỚC QUAN TRỌNG: DÁN LINK API MỚI VÀO DÒNG DƯỚI ĐÂY
    // ---------------------------------------------------------
    const GOOGLE_SHEET_API = "https://script.google.com/macros/s/AKfycbzFDzmGeYGz7fOqKOZaBwJHadivmr-nzYLTkd51rpgkLxVs1cTsLUvKpQezIxvIrs_4/exec";

    document.addEventListener('DOMContentLoaded', () => {
        hienThiKeHoach();
        hienThiTKB();
        dongBoDuLieuTuSheet(); // Tự động kéo dữ liệu khi mở web
    });

    function showToast(message) {
        const toast = document.getElementById("toast");
        document.getElementById("toast-msg").innerText = message;
        toast.className = "show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }

    // --- HÀM TẢI DỮ LIỆU TỪ GOOGLE SHEETS (GET) ---
    function dongBoDuLieuTuSheet() {
        if(!GOOGLE_SHEET_API.includes("script.google.com")) return;
        
        document.getElementById('loadingMon').style.display = 'block';
        document.getElementById('loadingTKB').style.display = 'block';

        fetch(GOOGLE_SHEET_API)
            .then(res => res.json())
            .then(data => {
                localStorage.setItem('keHoachMon', JSON.stringify(data.mon));
                localStorage.setItem('tkbNgay', JSON.stringify(data.tkb));
                hienThiKeHoach();
                hienThiTKB();
                showToast("Đã đồng bộ dữ liệu mới nhất!");
            })
            .catch(err => {
                console.error(err);
                showToast("Dùng dữ liệu ngoại tuyến (Lỗi mạng)");
            })
            .finally(() => {
                document.getElementById('loadingMon').style.display = 'none';
                document.getElementById('loadingTKB').style.display = 'none';
            });
    }

    // --- HÀM GỬI YÊU CẦU LÊN GOOGLE SHEETS (POST) ---
    function guiLenSheet(payload) {
        if(GOOGLE_SHEET_API.includes("script.google.com")) {
            fetch(GOOGLE_SHEET_API, {
                method: 'POST',
                body: JSON.stringify(payload)
            }).catch(e => console.log("Lỗi đồng bộ ngầm:", e));
        }
    }

    // --- XỬ LÝ MÔN HỌC ---
    function themKeHoachMon() {
        const mon = document.getElementById('monHoc').value;
        const noiDung = document.getElementById('noiDungMon').value.trim();
        if (!noiDung) return alert('Vui lòng nhập nội dung!');

        const id = Date.now();
        const ds = JSON.parse(localStorage.getItem('keHoachMon') || '[]');
        ds.push({ id, mon, noiDung, completed: false });
        localStorage.setItem('keHoachMon', JSON.stringify(ds));
        
        document.getElementById('noiDungMon').value = '';
        hienThiKeHoach();
        
        guiLenSheet({ action: 'add', type: 'mon', id: id, mon: mon, noiDung: noiDung });
        showToast("Đã lưu mục tiêu " + mon);
    }

    function hienThiKeHoach() {
        const ds = JSON.parse(localStorage.getItem('keHoachMon') || '[]');
        const ul = document.getElementById('dsKeHoachMon');
        ul.innerHTML = ds.map(item => {
            const tagClass = ['Toán', 'Văn', 'Anh', 'Lý', 'Hóa', 'Sinh'].includes(item.mon) ? `tag-${item.mon}` : 'tag-default';
            return `
            <li class="${item.completed ? 'completed' : ''}">
                <div class="item-content" onclick="toggleHoanThanh('mon', ${item.id})">
                    <i class="fa-regular ${item.completed ? 'fa-square-check' : 'fa-square'}"></i>
                    <span class="item-text"><span class="tag ${tagClass}">${item.mon === 'Ngữ Văn' ? 'Văn' : item.mon === 'Tiếng Anh' ? 'Anh' : item.mon}</span> ${item.noiDung}</span>
                </div>
                <div class="actions">
                    <button class="btn-icon" onclick="xoaItem('mon', ${item.id})"><i class="fa-solid fa-trash"></i></button>
                </div>
            </li>
        `}).join('');
    }

    // --- XỬ LÝ THỜI KHÓA BIỂU ---
    function themTKB() {
        const gio = document.getElementById('gioHoc').value;
        const congViec = document.getElementById('congViec').value.trim();
        if (!gio || !congViec) return alert('Vui lòng nhập giờ và công việc!');

        const id = Date.now();
        const ds = JSON.parse(localStorage.getItem('tkbNgay') || '[]');
        ds.push({ id, gio, congViec, completed: false });
        ds.sort((a, b) => a.gio.localeCompare(b.gio)); 
        localStorage.setItem('tkbNgay', JSON.stringify(ds));

        document.getElementById('congViec').value = '';
        hienThiTKB();

        guiLenSheet({ action: 'add', type: 'tkb', id: id, gio: gio, congViec: congViec });
        showToast("Đã thêm lịch lúc " + gio);
    }

    function hienThiTKB() {
        const ds = JSON.parse(localStorage.getItem('tkbNgay') || '[]');
        const ul = document.getElementById('dsTKB');
        ul.innerHTML = ds.map(item => `
            <li class="${item.completed ? 'completed' : ''}">
                <div class="item-content" onclick="toggleHoanThanh('tkb', ${item.id})">
                    <i class="fa-regular ${item.completed ? 'fa-square-check' : 'fa-square'}"></i>
                    <span class="item-text"><strong>${item.gio}</strong> - ${item.congViec}</span>
                </div>
                <div class="actions">
                    <button class="btn-icon" onclick="xoaItem('tkb', ${item.id})"><i class="fa-solid fa-trash"></i></button>
                </div>
            </li>
        `).join('');
    }

    // --- TIỆN ÍCH: ĐÁNH DẤU XONG & XÓA ---
    function toggleHoanThanh(type, id) {
        const key = type === 'mon' ? 'keHoachMon' : 'tkbNgay';
        let ds = JSON.parse(localStorage.getItem(key) || '[]');
        const index = ds.findIndex(item => item.id === id);
        if(index > -1) {
            ds[index].completed = !ds[index].completed;
            localStorage.setItem(key, JSON.stringify(ds));
            type === 'mon' ? hienThiKeHoach() : hienThiTKB();
            
            guiLenSheet({ action: 'toggle', type: type, id: id });
        }
    }

    function xoaItem(type, id) {
        const key = type === 'mon' ? 'keHoachMon' : 'tkbNgay';
        let ds = JSON.parse(localStorage.getItem(key) || '[]');
        ds = ds.filter(item => item.id !== id);
        localStorage.setItem(key, JSON.stringify(ds));
        type === 'mon' ? hienThiKeHoach() : hienThiTKB();
        
        guiLenSheet({ action: 'delete', type: type, id: id });
        showToast("Đã xóa mục!");
    }
</script>

</body>
</html>
