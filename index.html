<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Học Tập Lớp 12</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #3498db; padding-bottom: 5px; color: #3498db; margin-top: 0; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input, select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; flex: 1; }
        button { background-color: #2ecc71; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #27ae60; }
        ul { list-style: none; padding: 0; }
        li { background: #f9f9f9; border-left: 4px solid #3498db; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-radius: 0 4px 4px 0; }
        .btn-delete { background: #e74c3c; padding: 4px 8px; font-size: 12px; }
        .btn-delete:hover { background: #c0392b; }
        .tag { background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Kế Hoạch & Thời Khóa Biểu Lớp 12</h1>

    <div class="grid">
        <!-- CỘT 1: KẾ HOẠCH MÔN HỌC LỚP 12 -->
        <div class="card">
            <h2>Mục Tiêu Môn Học</h2>
            <div class="input-group">
                <select id="monHoc">
                    <option value="Toán">Toán</option>
                    <option value="Văn">Ngữ Văn</option>
                    <option value="Anh">Tiếng Anh</option>
                    <option value="Lý">Vật Lý</option>
                    <option value="Hóa">Hóa Học</option>
                    <option value="Sinh">Sinh Học</option>
                    <option value="Sử/Địa/GDCD">Khác</option>
                </select>
                <input type="text" id="noiDungMon" placeholder="Mục tiêu (vd: Luyện 10 đề Ôn thi THPT)...">
                <button onclick="themKeHoachMon()">Thêm</button>
            </div>
            <ul id="dsKeHoachMon"></ul>
        </div>

        <!-- CỘT 2: THỜI KHÓA BIỂU TRONG NGÀY -->
        <div class="card">
            <h2>Thời Khóa Biểu Hôm Nay</h2>
            <div class="input-group">
                <input type="time" id="gioHoc">
                <input type="text" id="congViec" placeholder="Nhiệm vụ (vd: Học Lý thuyết Toán)...">
                <button onclick="themTKB()">Thêm</button>
            </div>
            <ul id="dsTKB"></ul>
        </div>
    </div>
</div>

<script>
    // Load dữ liệu khi mở trang
    document.addEventListener('DOMContentLoaded', () => {
        hienThiKeHoach();
        hienThiTKB();
    });

    // --- XỬ LÝ MÔN HỌC ---
    function themKeHoachMon() {
        const mon = document.getElementById('monHoc').value;
        const noiDung = document.getElementById('noiDungMon').value.trim();
        if (!noiDung) return alert('Vui lòng nhập nội dung!');

        const ds = JSON.parse(localStorage.getItem('keHoachMon') || '[]');
        ds.push({ id: Date.now(), mon, noiDung });
        localStorage.setItem('keHoachMon', JSON.stringify(ds));
        
        document.getElementById('noiDungMon').value = '';
        hienThiKeHoach();
    }

    function hienThiKeHoach() {
        const ds = JSON.parse(localStorage.getItem('keHoachMon') || '[]');
        const ul = document.getElementById('dsKeHoachMon');
        ul.innerHTML = ds.map(item => `
            <li>
                <span><span class="tag">${item.mon}</span> ${item.noiDung}</span>
                <button class="btn-delete" onclick="xoaKeHoach(${item.id})">Xóa</button>
            </li>
        `).join('');
    }

    function xoaKeHoach(id) {
        let ds = JSON.parse(localStorage.getItem('keHoachMon') || '[]');
        ds = ds.filter(item => item.id !== id);
        localStorage.setItem('keHoachMon', JSON.stringify(ds));
        hienThiKeHoach();
    }

    // --- XỬ LÝ THỜI KHÓA BIỂU NGÀY ---
    function themTKB() {
        const gio = document.getElementById('gioHoc').value;
        const congViec = document.getElementById('congViec').value.trim();
        if (!gio || !congViec) return alert('Vui lòng nhập đầy đủ giờ và công việc!');

        const ds = JSON.parse(localStorage.getItem('tkbNgay') || '[]');
        ds.push({ id: Date.now(), gio, congViec });
        ds.sort((a, b) => a.gio.localeCompare(b.gio)); // Sắp xếp theo giờ
        localStorage.setItem('tkbNgay', JSON.stringify(ds));

        document.getElementById('congViec').value = '';
        hienThiTKB();
    }

    function hienThiTKB() {
        const ds = JSON.parse(localStorage.getItem('tkbNgay') || '[]');
        const ul = document.getElementById('dsTKB');
        ul.innerHTML = ds.map(item => `
            <li>
                <span><strong>${item.gio}</strong>: ${item.congViec}</span>
                <button class="btn-delete" onclick="xoaTKB(${item.id})">Xóa</button>
            </li>
        `).join('');
    }

    function xoaTKB(id) {
        let ds = JSON.parse(localStorage.getItem('tkbNgay') || '[]');
        ds = ds.filter(item => item.id !== id);
        localStorage.setItem('tkbNgay', JSON.stringify(ds));
        hienThiTKB();
    }
</script>

</body>
</html>
